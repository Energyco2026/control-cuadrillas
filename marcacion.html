<title>Marcación en obra · ENERGYCONTROL</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16231F; --muted:#5D6B66; --line:#DCE3E0;
  --accent:#4A7D1C; --hivis:#81BD41;
  --ok:#1F8A4C; --ok-bg:#E3F4EA; --warn:#B26B00; --warn-bg:#FFF1D9; --bad:#B42318; --bad-bg:#FDE7E5;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logo{display:block;background:#fff;border-radius:10px;padding:6px 10px}.logo img{display:block;height:44px;width:auto}
.stripe{width:10px;height:26px;background:var(--hivis);border-radius:2px}
h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{font:500 20px var(--f-mono);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;letter-spacing:.06em}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.tipo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 8px;font:700 20px var(--f-display);cursor:pointer}
.tipo button[aria-pressed="true"].in{background:var(--ok);border-color:var(--ok);color:#fff}
.tipo button[aria-pressed="true"].out{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:15px;font:700 19px var(--f-display);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cam{position:relative;width:100%;aspect-ratio:3/4;background:#0d1512;border-radius:12px;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam img{width:100%;height:100%;object-fit:contain;background:#0d1512}
.cam img{transform:none}
.cam .oval{position:absolute;inset:12% 18%;border:3px dashed rgba(255,255,255,.55);border-radius:50%;pointer-events:none}
.gps{font-size:13px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.gps .d{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.gps.ok .d{background:var(--ok)} .gps.bad .d{background:var(--bad)}
.msg{border-radius:10px;padding:12px;font-size:15px;margin:0}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
.big{font-family:var(--f-display);font-size:28px;line-height:1.1;color:var(--ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.foot{color:var(--muted);font-size:12px;text-align:center}
[hidden]{display:none!important}
</style>
</head>

async function iniciarCamara(){
  blob=null;$('foto').hidden=true;$('video').hidden=false;$('oval').hidden=false;
  $('acciones1').hidden=false;$('acciones2').hidden=true;err('err2','');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false});
    $('video').srcObject=stream;
  }catch(e){
    err('err2','No se pudo abrir la cámara. Permite el acceso a la cámara en el navegador y vuelve a intentar.');
  }
}
function pararCamara(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

function iniciarGPS(){
  pos=null;const g=$('gps');g.className='gps';$('gpsTxt').textContent='Buscando ubicación…';
  if(!('geolocation' in navigator)){g.className='gps bad';$('gpsTxt').textContent='Este celular no tiene GPS disponible.';return;}
  if(gpsWatch!==null) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=navigator.geolocation.watchPosition(p=>{
    if(!pos||p.coords.accuracy<pos.coords.accuracy) pos=p;
    const a=Math.round(pos.coords.accuracy);
    if(a>PRECISION_MAX){g.className='gps bad';
      $('gpsTxt').textContent=a>500?`Ubicación aproximada (${a} m). Activa "Ubicación precisa" en los permisos del navegador y recarga la página.`:`Mejorando ubicación… precisión ${a} m. Sal al aire libre o espera unos segundos.`;}
    else{g.className='gps ok';$('gpsTxt').textContent=`Ubicación lista (precisión ${a} m)`;}
  },e=>{
    g.className='gps bad';
    $('gpsTxt').textContent=e.code===1?'Ubicación bloqueada. Activa el permiso de ubicación para esta página.':'No se pudo obtener la ubicación. Activa el GPS.';
  },{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function pararGPS(){if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;}}

$('disparar').onclick=()=>{
  const v=$('video');
  if(!v.videoWidth) return err('err2','La cámara aún no está lista.');
  const W=Math.min(640,v.videoWidth),H=Math.round(W*v.videoHeight/v.videoWidth);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,W,H);
  ctx.setTransform(1,0,0,1,0,0);
  // Sello visible en la foto
  const n=new Date(),t=n.toLocaleDateString('es-EC')+' '+n.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',hour12:false});
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H-30,W,30);
  ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText(t+'  '+(tipo||'').toUpperCase(),10,H-10);
  cv.toBlob(b=>{blob=b;$('foto').src=URL.createObjectURL(b);$('foto').hidden=false;$('video').hidden=true;$('oval').hidden=true;
    $('acciones1').hidden=true;$('acciones2').hidden=false;},'image/jpeg',0.72);
};
$('repetir').onclick=()=>{blob=null;$('foto').hidden=true;$('video').hidden=false;$('oval').hidden=false;$('acciones1').hidden=false;$('acciones2').hidden=true;};
$('cancelar').onclick=()=>{pararCamara();pararGPS();ir(1);};

$('enviar').onclick=async()=>{
  if(!blob) return err('err2','Primero toma la foto.');
  if(!pos) return err('err2','Todavía no hay ubicación. Espera unos segundos con el GPS activado.');
  if(pos.coords.accuracy>PRECISION_MAX) return err('err2',`La ubicación no es precisa (${Math.round(pos.coords.accuracy)} m). Si elegiste "Aproximada", cambia el permiso a "Precisa" en el candado junto a la dirección de la página y recarga.`);
  const b=$('enviar');b.disabled=true;b.textContent='Enviando…';err('err2','');
  try{
    const hoy=new Date().toISOString().slice(0,10);
    const path=`${hoy}/${crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}.jpg`;
    const up=await sb.storage.from('asis-selfies').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(up.error) throw new Error('No se pudo subir la foto. Revisa tu conexión de datos.');
    const {data,error}=await sb.rpc('asis_marcar',{p_cedula:$('ced').value,p_pin:$('pin').value,p_tipo:tipo,
      p_lat:pos.coords.latitude,p_lng:pos.coords.longitude,p_precision:pos.coords.accuracy,p_foto_path:path,p_dispositivo:equipo+' · '+navigator.userAgent.slice(0,120)});
    if(error) throw new Error('No se pudo registrar. Revisa tu conexión de datos e intenta otra vez.');
    if(!data.ok){err('err2',data.error);b.disabled=false;b.textContent='Enviar';
      if(/PIN|Cédula/i.test(data.error)){pararCamara();pararGPS();ir(1);err('err1',data.error);} return;}
    pararCamara();pararGPS();mostrar(data);
  }catch(e){err('err2',e.message);}
  b.disabled=false;b.textContent='Enviar';
};

function mostrar(d){
  const sinObra=/Sin obra/.test(d.obra);
  const cls=sinObra?'warn':(d.dentro?'ok':'bad');
  const linea=sinObra?'No tienes obra designada hoy. Avísale a tu administrador; RR.HH. revisará esta marcación.'
    :(d.dentro?`Estás en ${d.obra} (a ${d.distancia_m} m).`:`Estás a ${d.distancia_m} m de ${d.obra}. Quedó registrada, pero RR.HH. la revisará.`);
  $('resultado').innerHTML=`<p class="big">${tipo==='entrada'?'Entrada':'Salida'} registrada · ${d.hora}</p>
    <p style="margin:4px 0 10px">${d.nombre}</p><p class="msg ${cls}">${linea}</p>`;
  ir(3);
  $('ced').value='';$('pin').value='';setTipo(null);blob=null;
}
$('otro').onclick=()=>ir(1);
</script>
